components:
    schemas:
        Company:
            type: object
            properties:
                id:
                    type: integer
                    readOnly: true
                name:
                    type: string
                taxID:
                    type: string
            required:
                - name
                - taxID
            description: Company model
        CompanyCreate:
            type: object
            properties:
                name:
                    type: string
                taxID:
                    type: string
            required:
                - name
                - taxID
            description: Create Company request
        CompanyList:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Company'
                meta:
                    type: object
                    properties:
                        page:
                            type: integer
                            description: Current page number
                        pageSize:
                            type: integer
                            description: Items per page
                        total:
                            type: integer
                            description: Total number of items
                        totalPages:
                            type: integer
                            description: Total number of pages
                    required:
                        - page
                        - pageSize
                        - total
                        - totalPages
            required:
                - data
                - meta
        CompanyUpdate:
            type: object
            properties:
                name:
                    type: string
                    nullable: true
                taxID:
                    type: string
                    nullable: true
            description: Update Company request
        ContactInfo:
            type: object
            properties:
                email:
                    type: string
                id:
                    type: integer
                    readOnly: true
                personID:
                    type: string
                    description: Foreign key to Person
                    nullable: true
            required:
                - email
            description: ContactInfo model
        ContactInfoCreate:
            type: object
            properties:
                email:
                    type: string
                personID:
                    type: string
                    description: Foreign key to Person
                    nullable: true
            required:
                - email
            description: Create ContactInfo request
        ContactInfoList:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/ContactInfo'
                meta:
                    type: object
                    properties:
                        page:
                            type: integer
                            description: Current page number
                        pageSize:
                            type: integer
                            description: Items per page
                        total:
                            type: integer
                            description: Total number of items
                        totalPages:
                            type: integer
                            description: Total number of pages
                    required:
                        - page
                        - pageSize
                        - total
                        - totalPages
            required:
                - data
                - meta
        ContactInfoUpdate:
            type: object
            properties:
                email:
                    type: string
                    nullable: true
                personID:
                    type: string
                    description: Foreign key to Person
                    nullable: true
            description: Update ContactInfo request
        Nationality:
            type: string
            enum:
                - German
                - French
                - American
            description: Nationality enumeration
        Person:
            type: object
            properties:
                companyID:
                    type: string
                    description: Foreign key to Company
                    nullable: true
                firstName:
                    type: string
                id:
                    type: integer
                    readOnly: true
                lastName:
                    type: string
                nationality:
                    $ref: '#/components/schemas/Nationality'
            required:
                - firstName
                - lastName
                - nationality
            description: Person model
        PersonCreate:
            type: object
            properties:
                companyID:
                    type: string
                    description: Foreign key to Company
                    nullable: true
                firstName:
                    type: string
                lastName:
                    type: string
                nationality:
                    $ref: '#/components/schemas/Nationality'
            required:
                - firstName
                - lastName
                - nationality
            description: Create Person request
        PersonList:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Person'
                meta:
                    type: object
                    properties:
                        page:
                            type: integer
                            description: Current page number
                        pageSize:
                            type: integer
                            description: Items per page
                        total:
                            type: integer
                            description: Total number of items
                        totalPages:
                            type: integer
                            description: Total number of pages
                    required:
                        - page
                        - pageSize
                        - total
                        - totalPages
            required:
                - data
                - meta
        PersonUpdate:
            type: object
            properties:
                companyID:
                    type: string
                    description: Foreign key to Company
                    nullable: true
                firstName:
                    type: string
                    nullable: true
                lastName:
                    type: string
                    nullable: true
                nationality:
                    $ref: '#/components/schemas/Nationality'
            description: Update Person request
    responses:
        Error:
            description: Error response
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        description: Error code
                                    message:
                                        type: string
                                        description: Error message
                                required:
                                    - code
                                    - message
                        required:
                            - error
    parameters:
        page:
            name: page
            in: query
            description: Page number
            schema:
                type: integer
                minimum: 1
        pageSize:
            name: pageSize
            in: query
            description: Number of items per page
            schema:
                type: integer
                minimum: 1
                maximum: 100
tags:
    - name: Company
      description: Operations on Company
    - name: ContactInfo
      description: Operations on ContactInfo
    - name: Person
      description: Operations on Person
