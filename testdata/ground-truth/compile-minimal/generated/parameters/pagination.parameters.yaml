kalo-morphe-origin: parameter
kalo-morphe-shared: true
parameters:
    page:
        name: page
        in: query
        description: Page number
        schema:
            type: integer
            minimum: 1
    pageSize:
        name: pageSize
        in: query
        description: Number of items per page
        schema:
            type: integer
            minimum: 1
            maximum: 100
