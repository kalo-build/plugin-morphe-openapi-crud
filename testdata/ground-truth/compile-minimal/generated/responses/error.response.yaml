kalo-morphe-origin: response
kalo-morphe-shared: true
responses:
    Error:
        description: Error response
        content:
            application/json:
                schema:
                    type: object
                    properties:
                        error:
                            type: object
                            properties:
                                code:
                                    type: string
                                    description: Error code
                                message:
                                    type: string
                                    description: Error message
                            required:
                                - code
                                - message
                    required:
                        - error
